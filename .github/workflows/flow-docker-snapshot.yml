name: 📦 Flow Snapshot Docker

on:
  push:
    branches-ignore:
      - 'main'
    paths-ignore:
      - 'CODEOWNERS'
      - '**.md'
      - '.**'
  workflow_dispatch:
    inputs:
      docker_build_enabled:
        description: 'Enable Docker build'
        required: false
        default: 'true'
      azdo_trigger_enabled:
        description: 'Enable Azure DevOps trigger'
        required: false
        default: 'true'
      argocd_target_branch:
        description: 'argocd target branch name'
        required: false
        default: 'main'
      postman_branch:
        description: postman branch name'
        required: false
        default: 'release-dev'

permissions:
  contents: read
  packages: write
env:
  # branch choosed by workflow_dispatch or by push event
  CURRENT_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}

jobs:
  checkout:
    name: 🔖 Checkout Repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.CURRENT_BRANCH }}

  docker-build:
    name: 📦 Docker Build and Push
    needs: checkout
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' || github.event.inputs.docker_build_enabled == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.CURRENT_BRANCH }}

      - name: Run Snapshot Docker Build/Push
        # https://github.com/pagopa/github-actions-template/releases/tag/v2.4.1
        uses: pagopa/github-actions-template/payments-flow-docker-snapshot@713f5abd8f8ee210e5f6a4243ae52eb7c1b3b5ab
        with:
          current_branch: ${{ github.ref_name }}